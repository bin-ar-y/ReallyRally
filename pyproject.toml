[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "really-rally"
version = "1.3.0"
description = "Automatically extract tennis rallies, serves, and feeds from practice videos using computer vision"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "bin-ar-y"},
]
keywords = ["tennis", "video", "computer-vision", "mediapipe", "sports-analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "imageio>=2.34.1",
    "mediapipe==0.10.9",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "customtkinter>=5.2.2",
    "tkinterdnd2>=0.3.0",
    "matplotlib>=3.7",
    # Imported directly by the Debug Studio for frame rendering. It arrives
    # transitively with customtkinter today, but relying on that is how a clean
    # install breaks.
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
really-rally = "really_rally.cli:main"
really-rally-gui = "really_rally.gui:main"
really-rally-studio = "really_rally.studio.app:main"

[project.urls]
Homepage = "https://github.com/bin-ar-y/really-rally"
Repository = "https://github.com/bin-ar-y/really-rally"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["really_rally", "really_rally.core", "really_rally.processors", "really_rally.utils"]

[tool.setuptools.package-data]
really_rally = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = [
    "E501",   # line too long
    "E701",   # multiple statements on one line — pre-existing style
    "F403",   # star imports — intentional design pattern for config.py
    "F405",   # star import names — intentional design pattern for config.py
    "F841",   # unused variable — pre-existing, to be cleaned up separately
    "B904",   # raise without from inside except — pre-existing
]

[tool.ruff.lint.per-file-ignores]
"src/really_rally/gui.py" = ["F401"]  # unused imports — kept for backwards compat
"tests/*" = ["F403", "F405"]
"benchmarks/*" = ["E402"]  # sys.path manipulation before imports

[tool.coverage.run]
source = ["src/really_rally"]
omit = ["tests/*"]
